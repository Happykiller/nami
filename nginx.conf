###############################################################################
# 1) Worker processes and events
###############################################################################
# Note: In a Docker + official Nginx image environment, 'user' is often 'nginx'.
# If the base image uses Debian/Ubuntu, you might see 'www-data' by default.
user  nginx;
worker_processes auto;  # Adjust automatically based on CPU cores

events {
    worker_connections 1024;  # Adjust for your traffic
    multi_accept on;
}

###############################################################################
# 2) HTTP block: Logging, SSL, security headers, DDoS limits, etc.
###############################################################################
http {
    ###########################################################################
    # 2.1) Log configuration & server tokens
    ###########################################################################
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ua="$upstream_addr" us="$upstream_status"';
    
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Hide Nginx version info
    server_tokens off;

    ###########################################################################
    # 2.2) Gzip compression
    ###########################################################################
    gzip on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    ###########################################################################
    # 2.3) Security headers
    ###########################################################################
    # The 'add_header' directives here apply to all server blocks unless overridden.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ###########################################################################
    # 2.4) SSL/TLS settings
    ###########################################################################
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Example modern cipher suite. Adjust if you have specific needs (RSA/ECDSA).
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5:!DES:!RC4:!DSS';

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;  # Helps avoid reusing session tickets

    ###########################################################################
    # 2.5) Request limiting (anti-DDoS / bruteforce)
    ###########################################################################
    limit_req_zone $binary_remote_addr zone=ddos:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=bruteforce:10m rate=50r/s;

    ###########################################################################
    # 3) HTTP server (port 80) for Let's Encrypt challenge + redirect to HTTPS
    ###########################################################################
    server {
        listen 80;
        listen [::]:80;
        server_name
            happykiller.net
            www.happykiller.net
            wiki.happykiller.net
            york.happykiller.net
            stella.happykiller.net
            lilith.happykiller.net
            api.lilith.happykiller.net
            gold.happykiller.net
            api.gold.happykiller.net
            vergo.happykiller.net
            api.vergo.happykiller.net
            siguri.happykiller.net
            api.siguri.happykiller.net
            puppet.happykiller.net;

        # Certbot challenge directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # All other requests -> Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    ###########################################################################
    # 4) Upstream definitions (front & back). 
    ###########################################################################
    upstream lilith_front {
        server lilith_front:80;
    }
    upstream stella_front {
        server stella_admin:8080;
    }
    upstream wiki_front {
        server punk:80;
    }
    upstream gold_front {
        server gold_front:80;
    }
    upstream york_front {
        server york_web:8081;
    }
    upstream siguri_front {
        server siguri_front:80;
    }
    upstream vergo_front {
        server vergo_front:80;
    }

    upstream lilith_api {
        server lilith_back:3000;
    }
    upstream gold_api {
        server gold_back:3000;
    }
    upstream siguri_api {
        server siguri_back:3000;
    }
    upstream vergo_api {
        server vergo_back:3000;
    }
    upstream puppet_api {
        server puppet:8000;
    }

    ###########################################################################
    # 5) HTTPS server blocks (port 443)
    ###########################################################################
    # Example pattern: 
    #   - server_name
    #   - ssl_certificate / ssl_certificate_key
    #   - location -> proxy_pass
    #   - limit_req if needed
    ###########################################################################

    # 5.1) happykiller.net - general pass-through to itself (example)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name happykiller.net;

        ssl_certificate     /etc/letsencrypt/live/happykiller.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/happykiller.net/privkey.pem;

        location / {
            proxy_pass http://happykiller.net;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            # Example request limiting
            limit_req zone=ddos burst=10;
        }
    }

    # 5.2) lilith.happykiller.net (front)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name lilith.happykiller.net;

        ssl_certificate     /etc/letsencrypt/live/lilith.happykiller.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lilith.happykiller.net/privkey.pem;

        location / {
            proxy_pass http://lilith_front;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            limit_req zone=ddos burst=10;
        }
    }

    # 5.3) api.lilith.happykiller.net (API with GraphQL, WebSockets, etc.)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.lilith.happykiller.net;

        ssl_certificate     /etc/letsencrypt/live/api.lilith.happykiller.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lilith.happykiller.net/privkey.pem;

        location /graphql {
            include /etc/nginx/cors.conf;
            proxy_pass http://lilith_api/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            limit_req zone=bruteforce burst=100;
        }

        location /websocket {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://lilith_api/graphql;

            limit_req zone=bruteforce burst=100;
        }
    }

    # 5.4) stella.happykiller.net (front)
    server {
        listen 443 ssl;
