server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;

    server_name puppet.happykiller.net;

    ssl_certificate /etc/letsencrypt/live/puppet.happykiller.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puppet.happykiller.net/privkey.pem;

    # Timeout settings
    client_header_timeout 120s;
    client_body_timeout 120s;
    keepalive_timeout 120s;

    location / {
        proxy_pass http://host.docker.internal:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Timeout settings
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}