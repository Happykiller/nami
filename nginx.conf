    # 5.13) puppet.happykiller.net (API/service with increased timeouts)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name puppet.happykiller.net;

        ssl_certificate     /etc/letsencrypt/live/puppet.happykiller.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/puppet.happykiller.net/privkey.pem;

        # Extended timeouts for big deployments/uploads
        client_header_timeout 120s;
        client_body_timeout   120s;
        keepalive_timeout     120s;

        location / {
            proxy_pass http://puppet_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 120s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            limit_req zone=bruteforce burst=100;
        }
    }
